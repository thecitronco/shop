<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Citron Co.</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="hero">

    <img src="images/logo.png" class="hero-logo" alt="The Citron Co.">

    <h1>Premium Dehydrated Fruit Garnishes</h1>

    <p>
        Beautifully handcrafted citrus and fruit slices
        for cocktails, events and everyday enjoyment.
    </p>

    <a href="#shop" class="shop-now">
        Shop Now
    </a>

</section>

<header class="header">

    <div class="logo">

        <img src="images/logo.png" alt="The Citron Co.">

    </div>

    <div class="search">

        <input
            type="text"
            id="search"
            placeholder="Search Products..."
        >

    </div>

    <button class="cart-button">

        Cart

        <span id="cart-count">0</span>

    </button>

</header>

<main id="shop">

<section id="products" class="products-grid"></section>

</main>

<div id="cart-panel"></div>

<script src="script.js"></script>

</body>

</html>
